[package]
name = "lagless"
version = "0.1.0"
edition = "2024"
description = "Low-latency WebRTC data channels for real-time games (Node.js native module)"
license = "MIT"
repository = "https://github.com/stasadance/lagless"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# webrtc-rs/rtc fork with RACK-TLP, cwnd and stats patches (see README)
rtc = { git = "https://github.com/stasadance/rtc", branch = "lagless" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
bytes = "1"
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
