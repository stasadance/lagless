name: release
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error
      # the generated loader + types are the same on every platform; keep one copy
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: loader
          path: |
            binding.js
            binding.d.ts
          if-no-files-found: error

  publish:
    # main only: publishes when package.json has a version npm doesn't have yet
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs node >= 22.14 and npm >= 11.5.1
          registry-url: https://registry.npmjs.org
      - id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "lagless@$v" version >/dev/null 2>&1; then
            echo "lagless@$v is already on npm, nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish
        run: pnpm install --frozen-lockfile
      # every platform's .node goes into the one package; binding.js loads the matching file
      - if: steps.check.outputs.publish
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          merge-multiple: true
      - if: steps.check.outputs.publish
        uses: actions/download-artifact@v4
        with:
          name: loader
      - if: steps.check.outputs.publish
        run: pnpm build:ts
      - if: steps.check.outputs.publish
        run: ls -l *.node && test $(ls *.node | wc -l) -eq 5
      - if: steps.check.outputs.publish
        run: npm publish --access public
