name: release
# Run by hand (Actions > release > Run workflow) on main. Version is YY.M.N (UTC), N =
# commits on main since the month started (semver: no leading zeros, so Jan = 27.1.N).
# It's stamped into package.json at publish time only (no commit to main), then main's
# commit is tagged v<version> with a GitHub release. Re-running is safe: a version
# already on npm isn't published again; an existing release means no new commits.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history to count this month's commits
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::run this on main, not $GITHUB_REF"; exit 1
          fi
          n=$(git rev-list --count --since="$(date -u +%Y-%m-01T00:00:00Z)" HEAD)
          v="$(date -u +%y.%-m).$n"
          echo "version $v ($n commits on main this month)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "::error::release v$v already exists, no new commits on main since"; exit 1
          fi
          if npm view "lagless@$v" version >/dev/null 2>&1; then
            echo "lagless@$v is already on npm, skipping build+publish, only tagging"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, alpine: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, alpine: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # musl builds run inside Alpine (musl libc), the rest natively
      - if: matrix.alpine
        run: docker run --rm -v "$PWD:/w" node:22-alpine sh /w/.github/scripts/alpine.sh ${{ matrix.target }}
      - if: ${{ !matrix.alpine }}
        uses: pnpm/action-setup@v4
      - if: ${{ !matrix.alpine }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: ${{ !matrix.alpine }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: ${{ !matrix.alpine }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: ${{ !matrix.alpine }}
        run: pnpm install --frozen-lockfile
      - if: ${{ !matrix.alpine }}
        run: pnpm build:native --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error
      # the generated loader + types are the same on every platform; keep one copy
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: loader
          path: |
            binding.js
            binding.d.ts
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs node >= 22.14 and npm >= 11.5.1
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # every platform's .node goes into the one package; binding.js loads the matching file
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: loader
      - run: pnpm build:ts
      - run: ls -l *.node && test $(ls *.node | wc -l) -eq 7
      - run: npm version "${{ needs.check.outputs.version }}" --no-git-tag-version
      - run: npm publish --access public

  release:
    needs: [check, publish]
    # also runs when publish was skipped (version already on npm), not when it failed
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tag + release
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$V" --generate-notes
