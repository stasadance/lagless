name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/website.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/website.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# one run per branch/PR: a new push cancels the old run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # every PR and main push: Linux x64, loopback e2e + TURN + 50-peer load test + browser
  # audio e2e (Chromium, Firefox, WebKit) + Rust tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs restore main's cache but don't save their own
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y coturn
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
        env:
          LAGLESS_REQUIRE_BROWSERS: '1'
      - run: pnpm test:rust

  # main (or by hand) only: e2e on the other prebuilt platforms, Alpine/musl, and a soak
  platforms:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  alpine:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/w" node:22-alpine sh /w/.github/scripts/alpine.sh ${{ matrix.target }} test

  # memory / thread leak soak with peer churn (Linux counts threads)
  soak:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:soak
        env:
          SOAK_SECONDS: 300
