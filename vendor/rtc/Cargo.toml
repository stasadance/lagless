[workspace]
members = [
    "rtc-crypto",
    "rtc-datachannel",
    "rtc-dtls",
    "rtc-ice",
    "rtc-interceptor",
    "rtc-media",
    "rtc-mdns",
    "rtc-rtcp",
    "rtc-rtp",
    "rtc-sctp",
    "rtc-sdp",
    "rtc-shared",
    "rtc-srtp",
    "rtc-stun",
    "rtc-turn",
]
resolver = "2"

[profile.dev]
opt-level = 0

[workspace.package]
version = "0.21.1"
authors = ["Rain Liu <yliu@webrtc.rs>"]
edition = "2024"
license = "MIT/Apache-2.0"
homepage = "https://webrtc.rs"
repository = "https://github.com/webrtc-rs/rtc"
keywords = ["sansio", "networking", "protocols"]
categories = ["network-programming"]

[workspace.dependencies]
crypto = { version = "0.21.1", path = "rtc-crypto", package = "rtc-crypto", default-features = false }
datachannel = { version = "0.21.1", path = "rtc-datachannel", package = "rtc-datachannel" }
dtls = { version = "0.21.1", path = "rtc-dtls", package = "rtc-dtls", default-features = false }
ice = { version = "0.21.1", path = "rtc-ice", package = "rtc-ice", default-features = false }
interceptor = { version = "0.21.1", path = "rtc-interceptor", package = "rtc-interceptor" }
mdns = { version = "0.21.1", path = "rtc-mdns", package = "rtc-mdns" }
media = { version = "0.21.1", path = "rtc-media", package = "rtc-media" }
rtcp = { version = "0.21.1", path = "rtc-rtcp", package = "rtc-rtcp" }
rtp = { version = "0.21.1", path = "rtc-rtp", package = "rtc-rtp" }
sctp = { version = "0.21.1", path = "rtc-sctp", package = "rtc-sctp" }
sdp = { version = "0.21.1", path = "rtc-sdp", package = "rtc-sdp" }
shared = { version = "0.21.1", path = "rtc-shared", package = "rtc-shared", default-features = false }
srtp = { version = "0.21.1", path = "rtc-srtp", package = "rtc-srtp", default-features = false }
stun = { version = "0.21.1", path = "rtc-stun", package = "rtc-stun", default-features = false }
turn = { version = "0.21.1", path = "rtc-turn", package = "rtc-turn", default-features = false }

# common dependencies
sansio = "1"
bytes = "1.12.0"
byteorder = "1.5.0"
log = "0.4.33"
rcgen = { version = "0.14.8", features = ["pem"], default-features = false }
ring = "0.17.14"
aws-lc-rs = { version = "1.17.3", features = ["aws-lc-sys"], default-features = false }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.114"
thiserror = "2.0.18"
zeroize = "1.8.2"
pem = "3.0.3"
aes = "0.8.4"
ctr = "0.9.2"
ccm = "0.5.0"
md-5 = "0.10.6"
hmac = "0.12.1"
sha1 = "0.10.6"
subtle = "2.6.1"
x509-parser = "0.16.0"
der-parser = "9.0.0"
rustls = { version = "0.23.27", default-features = false, features = ["std"] }
rkyv = "0.8.17"
bytecheck = "0.8"
url = "2.5.0"
base64 = "0.22.1"
crc = "3.0.1"
slab = "0.4.9"
crc32c = "0.6"
rustc-hash = "2"
memchr = "2.1.1"
socket2 = { version = "0.6", features = ["all"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
uuid = { version = "1", features = ["v4"] }
unicase = "2.8"
substring = "1.4.5"

# dev dependencies
env_logger = "0.11.11"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
criterion = "0.8.2"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
tokio-tungstenite = "0.28.0"
hyper = { version = "0.14.28", features = ["full"] }
lazy_static = "1.4.0"
hex = "0.4.3"
crossbeam-channel = "0.5"
assert_matches = "1.5.0"
nearly_eq = "0.2"
regex = "1.10.3"
ipnet = "2.9.0"
waitgroup = "0.1.2"
futures = "0.3.30"
futures-util = "0.3"
local-sync = "0.1.1"
core_affinity = "0.8.1"
anyhow = "1.0.80"

[package]
name = "rtc"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Sans-I/O WebRTC implementation in Rust"
license.workspace = true
documentation = "https://docs.rs/rtc"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["crypto-ring"]
crypto-ring = ["crypto/crypto-ring", "dtls/crypto-ring", "rustls/ring", "rcgen/ring", "ice/crypto-ring", "stun/crypto-ring", "srtp/crypto-ring", "turn/crypto-ring"]
crypto-aws-lc-rs = ["crypto/crypto-aws-lc-rs", "dtls/crypto-aws-lc-rs", "rustls/aws-lc-rs", "rcgen/aws_lc_rs", "ice/crypto-aws-lc-rs", "stun/crypto-aws-lc-rs", "srtp/crypto-aws-lc-rs", "turn/crypto-aws-lc-rs"]

[dependencies]
shared = { workspace = true, default-features = false, features = ["marshal", "replay"] }
crypto.workspace = true
sansio.workspace = true
datachannel.workspace = true
dtls.workspace = true
ice.workspace = true
interceptor.workspace = true
mdns.workspace = true
media.workspace = true
rtcp.workspace = true
rtp.workspace = true
sctp.workspace = true
sdp.workspace = true
srtp.workspace = true
stun.workspace = true
turn.workspace = true

bytes.workspace = true
rustc-hash.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
rcgen.workspace = true
rustls.workspace = true
url.workspace = true
hex.workspace = true
pem.workspace = true
x509-parser.workspace = true
unicase.workspace = true
rand.workspace = true

